name: kunit-build

on:
  workflow_call:
    inputs:
      commit_url:
        type: string
        required: true
        description: |
          内核源码仓库commit链接, 如: 
            - https://github.com/RVCK-Project/rvck/commit/32c7ba2136024ee1563416607e3265ccbee6a55e
            - https://github.com/RVCK-Project/rvck-olk/pull/103
      
      upload_dir:
        type: string
        required: true
        description: '上传目录'
      guix_image:
        type: string
        description: 'guix docker镜像'
        default: 'hub.oepkgs.net/oerv-ci/guix-kernel-cross-build:openeuler-release'

    outputs:
      kernel_files_url:
        value: ${{ jobs.kernel-build.outputs.kernel_files_url }}
      kernel_md5sum:
        value: ${{ jobs.kernel-build.outputs.kernel_md5sum }}
      initramfs_md5sum:
        value: ${{ jobs.kernel-build.outputs.initramfs_md5sum }}
      summary_content:
        value: ${{ jobs.kernel-build.outputs.summary_content }}
    
    secrets:
      rync_passphrase: 
        required: true
        description: 'rsync上传内核所需密码'

jobs:
  kernel-build:
    runs-on:
      group: kernel_build-runner
            
    outputs:
      kernel_files_url: ${{ steps.publish-kernel.outputs.kernel_files_url }}
      kernel_md5sum: ${{ steps.publish-kernel.outputs.kernel_md5sum }}
      initramfs_md5sum: ${{ steps.publish-kernel.outputs.initramfs_md5sum }}
      summary_content: ${{ steps.summary.outputs.summary_content }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      kernel_result_dir: guix_result

    steps:
      - name: clean ws
        run: |
          sudo rm -rf ./* || true

      - name: Wait for lock to disappear
        run: |
          lock_file="/tmp/kernel-build.lock"
          max_wait_minutes=120
          interval_seconds=30
          waited=0

          echo "Checking for existing lock..."

          while [ -f "$lock_file" ]; do
            if [ $waited -ge $((max_wait_minutes * 60)) ]; then
              echo "ERROR: Timeout waiting for lock to disappear after ${max_wait_minutes} minutes"
              exit 1
            fi
            echo "Lock exists, waiting ${interval_seconds} seconds... (waited ${waited}s)"
            sleep $interval_seconds
            waited=$((waited + interval_seconds))
          done

          echo "No lock found, proceeding..."

      - name: Create lock
        run: |
          lock_file="/tmp/kernel-build.lock"
          lock_content="Locked by workflow run: ${{ github.run_id }} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "$lock_content" > "$lock_file"
          echo "Lock created at ${lock_file}"

      - name: binfmt_misc mount before setup qemu
        run: ls -alh /proc/sys/fs/binfmt_misc

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3      
      
      - name: test qemu
        run: docker run --rm --platform linux/riscv64 alpine uname -a

      - name: kernel-build
        id: kernel-build
        run: |
          set -eo pipefail
          mkdir -p "${kernel_result_dir}"
          if (
          docker run --pull=always --privileged --rm \
            -v "$(pwd)/${kernel_result_dir}:/srv/guix_result" \
            "${{ inputs.guix_image }}" \
            guix-cross-build ${{ inputs.commit_url }} | tee "${kernel_result_dir}/build.log"
          ); then
            echo "kernel_build_result=true" >> $GITHUB_OUTPUT
          else
            echo "kernel_build_result=false" >> $GITHUB_OUTPUT
          fi
      
      - name: show guix log
        if: ${{ !cancelled() }}
        run: |
          for logfile in "${kernel_result_dir}"/*/*.log; do
            if [ ! -f "$logfile" ]; then continue; fi

            echo "--------------------"
            echo "logfile: ${logfile##*/}"
            echo "--------------------"
            cat $logfile || true
            echo "===================="
            echo ""
          done

      - name: publish kernel
        id: publish-kernel
        if: ${{ !cancelled() }}
        env:
          RSYNC_PASSWORD: ${{ secrets.rync_passphrase }}
        run: |
          rsync -av --progress --mkpath "${kernel_result_dir}"/*/* rvck@10.30.190.110::RVCK/${{ inputs.upload_dir }}/
          echo "kernel_files_domain_url=https://repo.tarsier-infra.isrc.ac.cn/openEuler-RISC-V/RVCK/OERV-RVCI/${{ inputs.upload_dir }}" >> $GITHUB_OUTPUT
          echo "kernel_files_url=http://10.30.190.110/openEuler-RISC-V/RVCK/OERV-RVCI/${{ inputs.upload_dir }}" >> $GITHUB_OUTPUT
          echo "kernel_md5sum=$(awk '{print $1}' "${kernel_result_dir}"/*/Image.md5sum)" >> $GITHUB_OUTPUT
          echo "initramfs_md5sum=$(awk '{print $1}' "${kernel_result_dir}"/*/initramfs.img.md5sum)" >> $GITHUB_OUTPUT
      
      - name: summary
        if: ${{ !cancelled() }}
        id: summary
        env:
          kernel_build_result: ${{ steps.kernel-build.outputs.kernel_build_result }}
          kernel_files_domain_url: ${{ steps.publish-kernel.outputs.kernel_files_domain_url }}
          kernel_files_url: ${{ steps.publish-kernel.outputs.kernel_files_url }}
          upload_dir: ${{ inputs.upload_dir }}
        run: |
          if [ "$kernel_build_result" = true ]; then
            result="Kernel build succeeded: [${upload_dir}]($kernel_files_domain_url)/"
          else
            result="Kernel build failed."
          fi

          summary_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/#summary-${{ job.check_run_id }}"
          {
            echo "## Kernel Build Result"
            echo ""
            echo "- $result"
            cat "${kernel_result_dir}"/*/*.md5sum 2>/dev/null | while read -r l; do
                echo "- $l"
            done
            echo ""
            echo "- detail log: ${summary_url}"
          } | tee summary
          
          echo "summary_content<<EOF" >> $GITHUB_OUTPUT
          cat summary >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          cat summary > $GITHUB_STEP_SUMMARY

          cat > $GITHUB_STEP_SUMMARY << EEE
          $(cat summary)
          
          \`\`\`log
          $(cat "${kernel_result_dir}"/build.log)
          \`\`\`
          EEE
          
          [ "$kernel_build_result" = true ] # 设置步骤状态

      - name: Delete lock
        if: always()
        run: |
          lock_file="/tmp/kernel-build.lock"
          rm -f "$lock_file"
          echo "Lock deleted at ${lock_file}"

